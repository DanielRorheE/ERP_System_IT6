<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">OUT OF BOREDOM SMS Cafe database ERD</title>
  <desc id="description">Five-table database ERD showing roles to users and categories to products one-to-many relationships. Orders are independent because the current database has no order_items table.</desc>
  <defs>
    <style>
      .page{fill:#fffaf2}.title{font:700 30px Arial,sans-serif;fill:#25211d}.subtitle{font:16px Arial,sans-serif;fill:#62584f}
      .entity{fill:#fff;stroke:#aa6a2a;stroke-width:2}.header{fill:#b85f1b}.entity-title{font:700 21px Arial,sans-serif;fill:#fff}
      .field{font:15px "Courier New",monospace;fill:#292520}.key{font-weight:700;fill:#9d4c12}.separator{stroke:#ead8c4;stroke-width:1}
      .relation{stroke:#5a493b;stroke-width:3;fill:none}.label{font:700 14px Arial,sans-serif;fill:#4a3c30}.note{font:14px Arial,sans-serif;fill:#62584f}
      .legend{fill:#fff1df;stroke:#ddaa72;stroke-width:1}.cardinality{fill:#fffaf2;stroke:#aa6a2a;stroke-width:1}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a493b"/></marker>
  </defs>
  <rect class="page" width="1600" height="1100"/>
  <text class="title" x="50" y="58">OUT OF BOREDOM - SMS Cafe Database ERD</text>
  <text class="subtitle" x="50" y="88">Five business tables | actual Laravel schema | one-to-many cardinality reference</text>

  <g transform="translate(60 160)"><rect class="entity" width="390" height="190" rx="8"/><path class="header" d="M8 0h374a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/><text class="entity-title" x="20" y="32">roles</text><line class="separator" x1="0" y1="50" x2="390" y2="50"/><text class="field" x="20" y="85"><tspan class="key">PK</tspan><tspan>  id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="120">    name VARCHAR(50) NOT NULL UNIQUE</text><text class="note" x="20" y="160">Current application value: owner</text></g>
  <g transform="translate(590 160)"><rect class="entity" width="430" height="226" rx="8"/><path class="header" d="M8 0h414a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/><text class="entity-title" x="20" y="32">users</text><line class="separator" x1="0" y1="50" x2="430" y2="50"/><text class="field" x="20" y="83"><tspan class="key">PK</tspan><tspan>  id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="116"><tspan class="key">FK</tspan><tspan>  role_id BIGINT UNSIGNED NOT NULL</tspan></text><text class="field" x="20" y="149">    email VARCHAR(255) NOT NULL UNIQUE</text><text class="field" x="20" y="182">    password VARCHAR(255) NOT NULL</text><text class="note" x="20" y="212">Owner account used by the application</text></g>
  <g transform="translate(1140 160)"><rect class="entity" width="400" height="190" rx="8"/><path class="header" d="M8 0h384a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/><text class="entity-title" x="20" y="32">categories</text><line class="separator" x1="0" y1="50" x2="400" y2="50"/><text class="field" x="20" y="85"><tspan class="key">PK</tspan><tspan>  id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="120">    name VARCHAR(120) NOT NULL UNIQUE</text><text class="note" x="20" y="160">Product classification</text></g>
  <g transform="translate(1070 510)"><rect class="entity" width="470" height="380" rx="8"/><path class="header" d="M8 0h454a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/><text class="entity-title" x="20" y="32">products</text><line class="separator" x1="0" y1="50" x2="470" y2="50"/><text class="field" x="20" y="84"><tspan class="key">PK</tspan><tspan>  id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="116"><tspan class="key">FK</tspan><tspan>  category_id BIGINT UNSIGNED NULL</tspan></text><text class="field" x="20" y="148">    name VARCHAR(150) NOT NULL</text><text class="field" x="20" y="180">    price DECIMAL(12,2) NOT NULL</text><text class="field" x="20" y="212">    cost_price DECIMAL(12,2) DEFAULT 0</text><text class="field" x="20" y="244">    stock_quantity DECIMAL(12,4) DEFAULT 0</text><text class="field" x="20" y="276">    is_available BOOLEAN DEFAULT TRUE</text><line class="separator" x1="20" y1="294" x2="450" y2="294"/><text class="note" x="20" y="322">Index: (is_available, name)</text><text class="note" x="20" y="350">category_id may be NULL</text></g>
  <g transform="translate(60 590)"><rect class="entity" width="500" height="300" rx="8"/><path class="header" d="M8 0h484a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/><text class="entity-title" x="20" y="32">orders</text><line class="separator" x1="0" y1="50" x2="500" y2="50"/><text class="field" x="20" y="84"><tspan class="key">PK</tspan><tspan>  id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="116">    order_number VARCHAR(40) NOT NULL UNIQUE</text><text class="field" x="20" y="148">    total_amount DECIMAL(14,2) NOT NULL</text><text class="field" x="20" y="180">    cost_total DECIMAL(14,2) DEFAULT 0</text><text class="field" x="20" y="212">    status VARCHAR(12) NOT NULL</text><text class="field" x="20" y="244">    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP</text><text class="note" x="20" y="278">Index: (status, created_at)</text></g>

  <path class="relation" d="M450 255 H590" marker-end="url(#arrow)"/><rect class="cardinality" x="462" y="226" width="24" height="24" rx="4"/><text class="label" x="470" y="243">1</text><rect class="cardinality" x="542" y="226" width="42" height="24" rx="4"/><text class="label" x="549" y="243">0..*</text><text class="label" x="474" y="278">assigns role</text>
  <path class="relation" d="M1340 350 V510" marker-end="url(#arrow)"/><rect class="cardinality" x="1318" y="366" width="24" height="24" rx="4"/><text class="label" x="1326" y="383">1</text><rect class="cardinality" x="1310" y="468" width="42" height="24" rx="4"/><text class="label" x="1317" y="485">0..*</text><text class="label" x="1360" y="432">categorizes</text>
  <g transform="translate(610 650)"><rect class="legend" width="390" height="190" rx="8"/><text class="label" x="20" y="32">Relationship notes</text><text class="note" x="20" y="66">1 role can have 0 or many users.</text><text class="note" x="20" y="98">1 category can have 0 or many products.</text><text class="note" x="20" y="130">A product has 0 or 1 category.</text><text class="note" x="20" y="162">Orders are standalone in this release.</text></g>
  <g transform="translate(610 850)"><rect class="entity" width="390" height="220" rx="8"/><path class="header" d="M8 0h374a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/><text class="entity-title" x="20" y="32">order_items</text><line class="separator" x1="0" y1="50" x2="390" y2="50"/><text class="field" x="20" y="84"><tspan class="key">PK</tspan><tspan>  id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="116"><tspan class="key">FK</tspan><tspan>  order_id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="148"><tspan class="key">FK</tspan><tspan>  product_id BIGINT UNSIGNED</tspan></text><text class="field" x="20" y="180">    quantity, unit_price, line_total</text><text class="note" x="20" y="208">Connects each sale to its product</text></g>
  <path class="relation" d="M560 740 L610 940" marker-end="url(#arrow)"/><rect class="cardinality" x="570" y="770" width="24" height="24" rx="4"/><text class="label" x="578" y="787">1</text><rect class="cardinality" x="590" y="900" width="42" height="24" rx="4"/><text class="label" x="597" y="917">1..*</text>
  <path class="relation" d="M1070 700 L1000 940" marker-end="url(#arrow)"/><rect class="cardinality" x="1035" y="730" width="24" height="24" rx="4"/><text class="label" x="1043" y="747">1</text><rect class="cardinality" x="990" y="900" width="42" height="24" rx="4"/><text class="label" x="997" y="917">0..*</text>
  <text class="note" x="60" y="1088">Reference: Laravel migrations. Orders now connect to products through order_items.</text>
</svg>
